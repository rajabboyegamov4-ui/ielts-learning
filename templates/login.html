<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - IELTS & AI Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @keyframes popUp {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4 relative font-sans overflow-hidden">

    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600/20 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600/20 rounded-full blur-[100px] pointer-events-none"></div>

    <div id="auth-container" class="bg-gray-800/80 backdrop-blur-md border border-gray-700 rounded-3xl p-8 w-full max-w-md shadow-2xl z-10 relative">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-2">
                IELTS & AI 🚀
            </h1>
            <p class="text-gray-400 text-sm">O'yin endi boshlandi!</p>
        </div>

        <div class="flex bg-gray-900 rounded-xl p-1 mb-8">
            <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 rounded-lg text-sm font-bold bg-gray-700 text-white transition-all shadow-md">Kirish</button>
            <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white transition-all">Ro'yxatdan o'tish</button>
        </div>

        <!-- KIRISH FORMASI -->
        <form id="form-login" class="space-y-5" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-gray-400 text-xs font-bold mb-2 uppercase">Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="text" id="log-username" class="w-full bg-gray-900 border border-gray-700 rounded-xl py-3 pl-10 pr-4 text-white focus:border-blue-500 focus:outline-none" placeholder="Foydalanuvchi nomi" required>
                </div>
            </div>
            <div>
                <label class="block text-gray-400 text-xs font-bold mb-2 uppercase">Parol</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="password" id="log-password" class="w-full bg-gray-900 border border-gray-700 rounded-xl py-3 pl-10 pr-4 text-white focus:border-blue-500 focus:outline-none" placeholder="••••••••" required>
                </div>
            </div>
            
            <!-- Parolni unutdim tugmasi -->
            <div class="text-right">
                <button type="button" onclick="openForgotPasswordModal()" class="text-xs text-purple-400 hover:underline">
                    Parolni unutdingizmi?
                </button>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition-transform hover:scale-[1.02]">
                Tizimga kirish
            </button>
        </form>

        <!-- RO'YXATDAN O'TISH FORMASI -->
        <form id="form-register" class="space-y-4 hidden" onsubmit="handleRegister(event)">
            <div>
                <label class="block text-gray-400 text-xs font-bold mb-1 uppercase">Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="text" id="reg-username" class="w-full bg-gray-900 border border-gray-700 rounded-xl py-2.5 pl-10 pr-4 text-white focus:border-purple-500 focus:outline-none" placeholder="Masalan: thisrejo" required>
                </div>
            </div>
            <div>
                <label class="block text-gray-400 text-xs font-bold mb-1 uppercase">Email</label>
                <div class="relative">
                    <i class="fa-solid fa-at absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="email" id="reg-email" class="w-full bg-gray-900 border border-gray-700 rounded-xl py-2.5 pl-10 pr-4 text-white focus:border-purple-500 focus:outline-none" placeholder="email@gmail.com" required>
                </div>
            </div>
            <div>
                <label class="block text-gray-400 text-xs font-bold mb-1 uppercase">Jinsingiz</label>
                <div class="flex gap-4">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="gender" value="male" class="peer hidden" checked>
                        <div class="text-center py-2 bg-gray-900 border border-gray-700 rounded-xl peer-checked:border-blue-500 peer-checked:bg-blue-900/30 text-gray-400 peer-checked:text-blue-400 transition-all font-bold">👦 Yigit</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="gender" value="female" class="peer hidden">
                        <div class="text-center py-2 bg-gray-900 border border-gray-700 rounded-xl peer-checked:border-pink-500 peer-checked:bg-pink-900/30 text-gray-400 peer-checked:text-pink-400 transition-all font-bold">👧 Qiz</div>
                    </label>
                </div>
            </div>
            <div>
                <label class="block text-gray-400 text-xs font-bold mb-1 uppercase">Parol</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="password" id="reg-password" class="w-full bg-gray-900 border border-gray-700 rounded-xl py-2.5 pl-10 pr-4 text-white focus:border-purple-500 focus:outline-none" placeholder="Kuchli parol" required>
                </div>
            </div>
            <button type="submit" id="reg-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 text-white font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(168,85,247,0.4)] transition-transform hover:scale-[1.02] flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-gift text-yellow-300"></i> Boshlash va Bonus olish
            </button>
        </form>
    </div>

    <!-- PAROLNI UNUTDIM MODAL OYNASI -->
    <div id="forgotModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-gray-800 border border-purple-500 rounded-3xl p-6 max-w-sm w-full text-white relative shadow-2xl">
            <button onclick="closeForgotPasswordModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            
            <h3 class="text-xl font-bold mb-2 text-purple-400 flex items-center gap-2">
                <i class="fa-solid fa-key"></i> Parolni tiklash
            </h3>
            <p class="text-xs text-gray-400 mb-4">Ro'yxatdan o'tgan emailingizni kiriting va yangi parol o'rnating.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Email</label>
                    <input type="email" id="forgotEmail" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:border-purple-500 focus:outline-none text-sm" placeholder="example@gmail.com">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Yangi parol</label>
                    <input type="password" id="forgotNewPassword" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:border-purple-500 focus:outline-none text-sm" placeholder="••••••••">
                </div>
                
                <button onclick="submitForgotPassword()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl transition shadow text-sm">
                    Parolni yangilash
                </button>
            </div>
        </div>
    </div>

    <!-- MUVAFFAQIYAT MODAL -->
    <div id="success-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-gray-800 border-2 border-yellow-500 rounded-3xl p-8 max-w-sm w-full text-center shadow-[0_0_50px_rgba(250,204,21,0.3)] animate-pop">
            <div class="w-24 h-24 mx-auto bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-full flex items-center justify-center mb-6 shadow-xl border-4 border-gray-900">
                <i class="fa-solid fa-coins text-4xl text-white"></i>
            </div>
            <h2 class="text-3xl font-black text-white mb-2">TABRIKLAYMIZ!</h2>
            <p class="text-gray-300 mb-6 font-medium">Platformaga xush kelibsiz. O'qishni boshlashingiz uchun sizga boshlang'ich kapital berildi:</p>
            
            <div class="bg-gray-900 border border-yellow-500/50 rounded-xl py-4 mb-6">
                <p class="text-sm text-yellow-500 font-bold mb-1">BALANSINGIZGA QO'SHILDI</p>
                <p class="text-4xl font-black text-yellow-400">+300,000</p>
            </div>

            <button onclick="window.location.href='/dashboard'" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-black py-4 rounded-xl shadow-lg transition-transform hover:scale-[1.02]">
                Qabul qilish va Boshlash
            </button>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const loginBtn = document.getElementById('tab-login');
            const registerBtn = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginBtn.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-gray-700 text-white transition-all shadow-md";
                registerBtn.className = "flex-1 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white transition-all";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerBtn.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-gray-700 text-white transition-all shadow-md";
                loginBtn.className = "flex-1 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white transition-all";
            }
        }

        // Parolni unutdim modalini ochish/yopish funksiyalari
        function openForgotPasswordModal() {
            document.getElementById('forgotModal').classList.remove('hidden');
        }

        function closeForgotPasswordModal() {
            document.getElementById('forgotModal').classList.add('hidden');
        }

        async function submitForgotPassword() {
            const email = document.getElementById('forgotEmail').value;
            const new_password = document.getElementById('forgotNewPassword').value;

            if (!email || !new_password) {
                alert("Iltimos, barcha maydonlarni to'ldiring!");
                return;
            }

            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, new_password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message);
                    closeForgotPasswordModal();
                } else {
                    alert(data.detail || "Xatolik yuz berdi!");
                }
            } catch (error) {
                alert("Server bilan ulanishda xatolik!");
            }
        }

        // Tizimga kirish (Login) logikasi
        async function handleLogin(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Kuting...';
            btn.disabled = true;

            const username = document.getElementById('log-username').value;
            const password = document.getElementById('log-password').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message + " Balansingiz: " + data.balance.toLocaleString() + " so'm");
                    window.location.href = '/dashboard';
                } else {
                    alert(data.detail || "Xatolik yuz berdi");
                }
            } catch (error) {
                alert("Server bilan ulanishda xatolik!");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Ro'yxatdan o'tish (Register) logikasi
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('reg-btn');
            const originalRegText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Kuting...';
            btn.disabled = true;

            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const gender = document.querySelector('input[name="gender"]:checked').value;

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password,
                        gender: gender
                    })
                });

                if (response.ok) {
                    document.getElementById('auth-container').style.display = 'none';
                    document.getElementById('success-modal').classList.remove('hidden');

                    var duration = 3000;
                    var end = Date.now() + duration;
                    (function frame() {
                        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#fbbf24', '#f59e0b', '#3b82f6', '#8b5cf6'] });
                        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#fbbf24', '#f59e0b', '#3b82f6', '#8b5cf6'] });
                        if (Date.now() < end) requestAnimationFrame(frame);
                    }());
                } else {
                    const data = await response.json();
                    alert(data.detail || "Xatolik yuz berdi");
                    btn.innerHTML = originalRegText;
                    btn.disabled = false;
                }
            } catch (error) {
                alert("Server bilan ulanishda xatolik!");
                btn.innerHTML = originalRegText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
