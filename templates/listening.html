<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening - IELTS Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
    <div class="max-w-3xl mx-auto">
        <a href="/" class="text-blue-400 hover:underline font-semibold mb-6 inline-block">
            ← Bosh sahifaga qaytish
        </a>
        <div class="bg-gray-800 rounded-2xl shadow-2xl p-8 border border-gray-700">
            <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-2">
                🎧 Listening Practice - Section 1
            </h1>
            <p class="text-gray-400 mb-6">Audioni diqqat bilan eshiting va savolga javob bering.</p>
            
            <div class="bg-gray-700 p-4 rounded-xl mb-8 border border-gray-600">
                <audio controls class="w-full">
                    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
                </audio>
            </div>

            <div class="space-y-4">
                <h3 class="text-lg font-semibold text-gray-200">1. What is the main topic of the conversation?</h3>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 bg-gray-700 p-3 rounded-lg cursor-pointer hover:bg-gray-600 border border-gray-600">
                        <input type="radio" name="q1" class="text-blue-500">
                        <span>A) Booking a hotel room for vacation</span>
                    </label>
                    <label class="flex items-center space-x-3 bg-gray-700 p-3 rounded-lg cursor-pointer hover:bg-gray-600 border border-gray-600">
                        <input type="radio" name="q1" class="text-blue-500">
                        <span>B) Registering for a library membership</span>
                    </label>
                </div>
            </div>

            <button onclick="alert('Javobingiz qabul qilindi! ✅')" class="mt-8 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg">
                Javobni Tekshirish
            </button>
        </div>
    </div>
</body>
</html>
